      html.annual-auth-checking #root { visibility: hidden; }
    </style>

    <link rel="stylesheet" crossorigin href="/annual/assets/index-cYCcyLb0.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const path = window.location.pathname;
        if (path !== "/annual" && !path.startsWith("/annual/")) return;
        document.documentElement.classList.add("annual-auth-checking");
        const token = localStorage.getItem("authToken");
        if (!token) {
          window.location.replace("/");
          return;
        }
        fetch("/api/check-token", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token }),
        })
          .then((response) => response.ok ? response.json() : null)
          .then((result) => {
            if (!result?.valid) {
              window.location.replace("/");
              return;
            }
            document.documentElement.classList.remove("annual-auth-checking");
          })
          .catch(() => window.location.replace("/"));
      })();
    </script>
  </body>
